<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="枫叶头像">
  <!-- 枫叶路径与 src/components/MapleLeaf.astro 同源（SVG 文件无法 import，只能内联） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf3e3" />
      <stop offset="0.55" stop-color="#f8ddb8" />
      <stop offset="1" stop-color="#f2c795" />
    </linearGradient>
    <linearGradient id="leafMain" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ee8c4a" />
      <stop offset="0.6" stop-color="#e2701f" />
      <stop offset="1" stop-color="#9e4613" />
    </linearGradient>
    <linearGradient id="leafSmall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c05a" />
      <stop offset="1" stop-color="#c0392b" />
    </linearGradient>
    <clipPath id="round">
      <circle cx="100" cy="100" r="100" />
    </clipPath>
    <path
      id="leaf"
      d="M12.00 0.60Q12.98 3.15 13.63 8.95Q17.71 6.44 19.97 5.92Q19.06 8.04 15.88 11.63Q20.26 13.08 22.05 14.37Q19.91 16.39 15.21 17.19L12.90 19.40L12.90 23.40L11.10 23.40L11.10 19.40L8.79 17.19Q4.09 16.39 1.95 14.37Q3.74 13.08 8.12 11.63Q4.94 8.04 4.03 5.92Q6.29 6.44 10.37 8.95Q11.02 3.15 12.00 0.60Z"
    />
  </defs>

  <g clip-path="url(#round)">
    <rect width="200" height="200" fill="url(#bg)" />

    <!-- 柔和光斑 -->
    <circle cx="46" cy="38" r="54" fill="#ffffff" opacity="0.5" />
    <circle cx="166" cy="170" r="58" fill="#d9a62e" opacity="0.22" />

    <!-- 主叶：居中偏上 -->
    <g transform="translate(100 96) scale(4.4) translate(-12 -12)">
      <use href="#leaf" fill="url(#leafMain)" />
    </g>

    <!-- 副叶：左下 -->
    <g transform="translate(48 150) scale(2.0) rotate(-20) translate(-12 -12)">
      <use href="#leaf" fill="url(#leafSmall)" opacity="0.92" />
    </g>

    <!-- 副叶：右上 -->
    <g transform="translate(158 44) scale(1.55) rotate(34) translate(-12 -12)">
      <use href="#leaf" fill="#c2410c" opacity="0.5" />
    </g>
  </g>
</svg>
